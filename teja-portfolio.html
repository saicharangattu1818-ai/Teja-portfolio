<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Portfolio</title>
<style>
:root{
  --bg:#050507;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);
  --ink:#f4f4f6;--sub:#a1a1ad;--a1:#22e6c4;--a2:#7b61ff;
  --grad:linear-gradient(120deg,var(--a1),var(--a2));
  --radius:18px;--max:1000px;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font:400 16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--a1)}
a:focus-visible,button:focus-visible{outline:2px solid var(--a1);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}

/* Animated background glow */
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(90px)}
.glow i:nth-child(1){width:460px;height:460px;background:var(--a2);opacity:.35;top:-120px;left:-100px;animation:drift 18s ease-in-out infinite alternate}
.glow i:nth-child(2){width:420px;height:420px;background:var(--a1);opacity:.22;bottom:-140px;right:-100px;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(80px,60px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(5,5,7,.65);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-weight:700;font-size:18px;text-decoration:none;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:8px 14px;border-radius:999px;color:var(--sub);text-decoration:none;font-size:15px;transition:.25s}
nav a:hover{color:var(--ink);background:rgba(255,255,255,.07)}
#menuBtn{display:none;background:none;border:1px solid var(--line);color:var(--ink);
  border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}

/* Hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding:72px 0 32px}
.hello{color:var(--sub);margin:0 0 6px;font-size:18px}
h1{font-size:clamp(46px,9vw,84px);line-height:1;margin:0 0 14px;letter-spacing:-.03em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:clamp(20px,3.4vw,28px);font-weight:500;margin:0 0 16px;min-height:1.5em}
.caret{display:inline-block;width:3px;height:1em;background:var(--a1);margin-left:3px;vertical-align:-.12em;animation:blink 1s step-end infinite}
.tagline{color:var(--sub);max-width:34em;margin:0 0 20px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;list-style:none}
.meta li{border:1px solid var(--line);background:var(--card);padding:5px 14px;border-radius:999px;font-size:14px;color:var(--sub)}
.btn{display:inline-block;padding:12px 26px;border-radius:12px;text-decoration:none;font-weight:600;transition:.25s}
.btn.main{background:var(--grad);color:#050507}
.btn.main:hover{box-shadow:0 0 28px rgba(34,230,196,.4);transform:translateY(-2px)}
.btn.ghost{border:1px solid var(--line);color:var(--ink);margin-left:10px}
.btn.ghost:hover{border-color:var(--a1);color:var(--a1)}

.photo{position:relative;isolation:isolate;width:min(320px,72vw);aspect-ratio:1;justify-self:center}
.photo::before,.photo::after{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;
  background:conic-gradient(var(--a1),var(--a2),var(--a1));animation:spin 8s linear infinite}
.photo::after{filter:blur(28px);opacity:.5}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 15%;
  border:6px solid var(--bg);display:block;background:#111}
.badge{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;
  background:rgba(5,5,7,.85);border:1px solid var(--line);color:var(--ink);
  padding:6px 16px;border-radius:999px;font-size:13px;font-weight:500}

/* Sections */
section{padding:56px 0 8px}
h2{font-size:28px;margin:0 0 24px;letter-spacing:-.01em}
h2::after{content:"";display:block;width:48px;height:3px;border-radius:3px;background:var(--grad);margin-top:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;overflow:hidden;transition:transform .3s,border-color .3s}
.card>*{position:relative}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,0%),rgba(123,97,255,.22),transparent 60%)}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.card:hover::before{opacity:1}
.card h3.t{margin:0 0 14px;font-size:18px}
.about p{margin:0;color:var(--sub);max-width:46em;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.timeline{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 4px 22px}
.timeline li::before{content:"";position:absolute;left:-31px;top:6px;width:16px;height:16px;border-radius:50%;
  background:var(--grad);border:3px solid var(--bg);box-shadow:0 0 14px rgba(34,230,196,.6)}
.timeline h3{margin:0;font-size:18px}
.timeline p{margin:2px 0 0;color:var(--sub);font-size:15px}
.yr{font-size:14px;font-weight:600;color:var(--a1)}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.chips li{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:8px 18px;border-radius:999px;font-size:15px;transition:.25s}
.chips li:hover{border-color:var(--a1);color:var(--a1);box-shadow:0 0 18px rgba(34,230,196,.25)}

.contact dl{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;margin:0}
.contact dt{color:var(--sub)}
.contact dd{margin:0;overflow-wrap:anywhere}
footer{margin-top:64px;padding:26px 0;border-top:1px solid var(--line);color:var(--sub);font-size:14px;text-align:center}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}

/* Mobile */
@media(max-width:760px){
  #menuBtn{display:inline-block}
  nav{position:absolute;left:0;right:0;top:62px;display:none;background:rgba(5,5,7,.96);border-bottom:1px solid var(--line)}
  nav.open{display:block}
  nav ul{flex-direction:column;padding:8px 20px 16px}
  .hero{grid-template-columns:1fr;text-align:center;padding-top:40px;gap:32px}
  .photo{order:-1}
  .tagline{margin-left:auto;margin-right:auto}
  .meta{justify-content:center}
  .btn.ghost{margin:10px 0 0}
  .grid2{grid-template-columns:1fr}
  .contact dl{grid-template-columns:1fr;gap:2px}
  .contact dt{margin-top:10px;font-size:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .glow i,.photo::before,.photo::after,.caret{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top" id="logo"></a>
    <nav id="nav" aria-label="Main"><ul id="navList"></ul></nav>
    <button id="menuBtn" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  </div>
</header>

<main id="top" class="wrap"></main>
<footer><div class="wrap" id="footer"></div></footer>

document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* Mobile menu */
const nav = $("nav"), menuBtn = $("menuBtn");
menuBtn.addEventListener("click", () => {
  const open = nav.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open);
});
nav.addEventListener("click", (e) => {
  if (e.target.tagName === "A") { nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
});
</script>
</body>
</html>
